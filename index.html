<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>映照</title>
    
    <link rel="manifest" href="manifest.json">
    
    <link rel="icon" type="image/svg+xml" href="Logo.svg">
    <link rel="alternate icon" type="image/png" href="image/logo.png">
    
    <link rel="apple-touch-icon" href="image/icon-192.png"> 
    
    <meta name="apple-mobile-web-app-capable" content="yes"> <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"> <meta name="apple-mobile-web-app-title" content="映照"> <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div id="loginOverlay" class="login-overlay">
        <div class="login-card glass-modal">
            <div class="login-icon-box">
                <img src="Logo.svg" alt="Logo" style="width: 80px; height: 80px; object-fit: contain;">
            </div>
            <h2 class="login-title">映照</h2>
            <p class="login-subtitle">记录不是为了证明什么，只是为了看清。</p>
            
            <div class="login-form">
                <input type="password" id="loginPassword" class="input-field login-input" placeholder="Password">
                <button id="btnLogin" class="primary-btn login-btn">解锁进入</button>
            </div>
            <p id="loginMsg" class="login-msg"></p>
        </div>
    </div>

    <header class="navbar glass-bar">
        <div class="navbar-content">
            <h1 class="app-title">映照</h1>
            
            <div class="navbar-actions">
                <button class="icon-btn secondary-icon" id="btnLogout" title="锁定/退出" style="margin-right: 4px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                </button>

                <button class="icon-btn secondary-icon" id="btnTheme" title="切换主题" style="margin-right: 8px;">
                    <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                    <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                </button>

                <input type="file" id="importFile" hidden accept=".json">
                
                <div class="action-group">
                    <button class="icon-btn secondary-icon" id="btnImportTrigger" title="导入">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    </button>
                    <button class="icon-btn secondary-icon" id="btnExport" title="导出">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    </button>
                </div>

                <button class="primary-btn circle-btn" id="btnNew" aria-label="新建">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <div id="toolbar-container" class="toolbar-area glass-bar">
        <div class="toolbar-content">
            <div class="search-row">
                <div class="search-wrapper">
                    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="text" id="searchInput" class="search-input" placeholder="搜索关键词...">
                </div>
            </div>
            <div class="tags-row" id="tagsBar"></div>
        </div>
    </div>

    <main id="app-container">
        <div id="memoList" class="grid-layout"></div>
        <div id="emptyState" class="empty-state" style="display: none;">
            <p>👋 欢迎回来<br>开始今天的自我观察吧</p>
        </div>
    </main>

    <div id="previewOverlay" class="modal-overlay">
        <div class="modal-card glass-modal">
            <div class="modal-header preview-header">
                <div class="preview-meta">
                    <span id="previewDate" class="meta-date"></span>
                    <span id="previewWeather" class="meta-item"></span>
                    <span id="previewMood" class="meta-item"></span>
                </div>
                <div class="header-actions">
                    <button id="btnDeletePreview" class="icon-btn edit-icon-btn danger-icon-btn" title="删除">🗑️</button>
                    <button id="btnToEdit" class="icon-btn edit-icon-btn" title="编辑">✏️</button>
                    <button class="close-btn btn-close-preview">✕</button>
                </div>
            </div>
            
            <div class="modal-body preview-body">
                <input type="hidden" id="previewId">
                <h2 id="previewTitle" class="preview-title"></h2>
                <div id="previewContentArea" class="preview-content-block"></div>
                <div id="previewDetails" class="preview-details"></div>
                <div id="previewTags" class="preview-tags-row"></div>
            </div>
        </div>
    </div>

    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-card glass-modal">
            <div class="modal-header">
                <span id="modalTitle">自我观察</span>
                
                <span class="header-hint">用于看见，而非评判</span>
                
                <button class="close-btn btn-close-modal">✕</button>
            </div>
            
            <div class="modal-body">
                <input type="hidden" id="noteId">
                
                <div class="form-section">
                    <div class="date-weather-row">
                        <input type="date" id="noteDate" class="input-field date-input">
                        
                        <select id="noteWeather" class="input-field meta-select">
                            <option value="☀️">☀️ 晴朗</option>
                            <option value="⛅">⛅ 多云</option>
                            <option value="☁️">☁️ 阴天</option>
                            <option value="🌧️">🌧️ 雨天</option>
                            <option value="⛈️">⛈️ 雷雨</option>
                            <option value="❄️">❄️ 雪天</option>
                            <option value="🌬️">🌬️ 大风</option>
                            <option value="🌫️">🌫️ 雾霾</option>
                        </select>

                        <select id="noteMood" class="input-field meta-select mood-select">
                            <option value="😐">😐 平淡</option>
                            <option value="😄">😄 很好</option>
                            <option value="🙂">🙂 不错</option>
                            <option value="😕">😕 低落</option>
                            <option value="😣">😣 很糟</option>
                        </select>
                    </div>
                </div>

                <div class="form-section">
                    <label class="form-label">一句话总结</label>
                    <input type="text" id="inpSummary" class="input-field title-input" placeholder="概括这次记录...">
                </div>
                <div class="form-section">
                    <label class="form-label">发生了什么（客观事实）</label>
                    <textarea id="inpFact" class="input-field content-input small-area" placeholder="今天发生了哪些关键事情？&#10;在什么场景，和谁？"></textarea>
                </div>
                <div class="form-section">
                    <label class="form-label">我当时的第一反应</label>
                    <textarea id="inpReaction" class="input-field content-input small-area" placeholder="我当时在想什么？&#10;情绪反应是怎样的？"></textarea>
                </div>
                <div class="form-section">
                    <label class="form-label">这反映了什么模式</label>
                    <input type="text" id="inpPattern" class="input-field" placeholder="比如：我总是习惯先责怪自己">
                </div>
                <div class="form-section highlight-section">
                    <label class="form-label highlight-label">✨ 下次我准备试试这样做（实验）</label>
                    <input type="text" id="inpExperiment" class="input-field highlight-input" placeholder="下次遇到类似情况时，尝试一个小改变...">
                </div>
                <div class="form-section">
                    <label class="form-label">标签</label>
                    <input type="text" id="noteTags" class="input-field tags-input" placeholder="工作, 情绪 (逗号分隔)">
                </div>
            </div>

            <div class="modal-footer">
                <button id="btnDelete" class="danger-btn" style="display: none;">删除</button>
                <button class="secondary-btn btn-close-modal">取消</button>
                <button id="btnSave" class="primary-btn save-btn">保存记录</button>
            </div>
        </div>
    </div>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('✅ PWA Service Worker 注册成功', reg.scope))
                    .catch(err => console.log('❌ PWA 注册失败: ', err));
            });
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
